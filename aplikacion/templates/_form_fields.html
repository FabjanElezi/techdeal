{% for field in form %}
<div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
           class="form-control{% if field.errors %} is-invalid{% endif %}" value="{% if field.field.widget.input_type != 'password' %}{{ field.value|default_if_none:'' }}{% endif %}"
           {% if field.field.required %}required{% endif %} autocomplete="{% if 'password' in field.name %}{% if 'password2' in field.name or form.password2 %}new-password{% else %}current-password{% endif %}{% elif field.name == 'username' %}username{% elif field.name == 'email' %}email{% else %}on{% endif %}">
    {% for error in field.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
    {% if field.help_text and form.password2 %}<div class="form-text small">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
